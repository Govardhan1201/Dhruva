<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <!-- Glow background -->
  <circle cx="50" cy="50" r="40" fill="url(#starGlow)"/>
  <!-- 8-pointed star: 4 long diamond petals at 0/90/180/270 -->
  <polygon points="50,10 55,45 50,50 45,45" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <polygon points="90,50 55,55 50,50 55,45" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <polygon points="50,90 45,55 50,50 55,55" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <polygon points="10,50 45,45 50,50 45,55" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <!-- 4 shorter diamond petals at 45/135/225/315 -->
  <polygon points="50,22 54,46 50,50 46,46" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="0.8" transform="rotate(45 50 50)"/>
  <polygon points="50,22 54,46 50,50 46,46" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="0.8" transform="rotate(135 50 50)"/>
  <polygon points="50,22 54,46 50,50 46,46" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="0.8" transform="rotate(225 50 50)"/>
  <polygon points="50,22 54,46 50,50 46,46" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="0.8" transform="rotate(315 50 50)"/>
  <!-- Center sparkle -->
  <circle cx="50" cy="50" r="3.5" fill="#fde68a"/>
  <circle cx="50" cy="50" r="1.5" fill="white"/>
</svg>
