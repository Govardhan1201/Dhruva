services:
  - type: web
    name: dhruva
    env: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build --prefix client && npm run build --prefix server
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
